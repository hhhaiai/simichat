name: Bundled Runtime Packages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  android-apk:
    name: Android bundled Node and 16 KB APK audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.9'
          channel: stable

      - name: Install Android SDK components used by the native runtime audit
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager_path="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "$sdkmanager_path" ]]; then
            sdkmanager_path="$(command -v sdkmanager)"
          fi
          "$sdkmanager_path" --install \
            "build-tools;35.0.1" \
            "ndk;28.2.13676358"

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Generate Dart sources
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Build release APK
        run: flutter build apk --release --no-pub

      - name: Verify APK contents and 16 KB native/ZIP alignment
        shell: bash
        run: |
          set -euo pipefail
          apk=build/app/outputs/flutter-apk/app-release.apk
          unzip -l "$apk" | grep -E 'libnode|libsimichat_node_bridge|libc\+\+_shared|runtime-server'
          zipalign_path="$(find "$ANDROID_HOME/build-tools" -type f -name zipalign -perm -111 | sort -V | tail -1)"
          ndk_path="$(find "$ANDROID_HOME/ndk" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          test -n "$zipalign_path"
          test -n "$ndk_path"
          LLVM_READELF="$ndk_path/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf" \
          ZIPALIGN="$zipalign_path" \
            ./scripts/verify_android_native_16k.sh "$apk"

  desktop-package:
    name: ${{ matrix.target }} bundled Node package
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: macos
            runtime_platform: macos-arm64
            node_path: build/macos/Build/Products/Release/ai_chat_app.app/Contents/Resources/node_runtime/macos-arm64/node
          - os: ubuntu-latest
            target: linux
            runtime_platform: linux-x64
            node_path: build/linux/x64/release/bundle/node_runtime/linux-x64/node
          - os: windows-latest
            target: windows
            runtime_platform: windows-x64
            node_path: build/windows/x64/runner/Release/node_runtime/windows-x64/node.exe

    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libsecret-1-dev

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.9'
          channel: stable

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Generate Dart sources
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Prepare exact bundled Node binary
        env:
          SIMICHAT_NODE_RUNTIME_PLATFORM: ${{ matrix.runtime_platform }}
        run: ./scripts/prepare_node_runtime.sh

      - name: Build release package
        env:
          SIMICHAT_NODE_RUNTIME_PLATFORM: ${{ matrix.runtime_platform }}
          CODE_SIGNING_ALLOWED: ${{ matrix.target == 'macos' && 'NO' || '' }}
          CODE_SIGNING_REQUIRED: ${{ matrix.target == 'macos' && 'NO' || '' }}
        run: flutter build ${{ matrix.target }} --release --no-pub

      - name: Verify package carries the target Node binary
        env:
          NODE_PATH: ${{ matrix.node_path }}
        run: |
          test -x "$NODE_PATH"
          "$NODE_PATH" --version
          printf 'SIMICHAT_DESKTOP_BUNDLED_NODE_PACKAGE_READY %s\n' "$NODE_PATH"

      - name: Run exact package Node MCP smoke
        env:
          SIMICHAT_MCP_RUNTIME_PORT: 37667
        run: ./scripts/verify_desktop_bundle.sh ${{ matrix.target }}
